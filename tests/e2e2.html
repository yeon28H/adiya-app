<!doctype html>
<meta charset="utf-8">
<title>e2e2: 안부 확인 / 도착 감지 / 막차 위험</title>
<pre id="out">RUNNING</pre>
<iframe id="f" style="width:420px;height:800px"></iframe>
<script>
const out = [];
const log = (ok, msg) => out.push((ok ? 'PASS ' : 'FAIL ') + msg);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
const D = () => f.contentDocument, W = () => f.contentWindow;
const text = () => D().body.innerText;
const clickAct = a => { const e = D().querySelector(`[data-act=${a}]`); if (!e) throw new Error('no [data-act=' + a + ']'); e.click(); };
const has = (t, msg) => log(text().includes(t), msg + ` ("${t}")`);
const hasNot = (t, msg) => log(!text().includes(t), msg + ` (없어야 함: "${t}")`);
const S = () => W().eval('Store');
const state = code => JSON.parse(W().localStorage.getItem('eodiya.v1')).meetings[code];

(async () => {
  try {
    f.src = 'seed.html?to=dash'; await sleep(1500);
    const code = W().location.hash.split('/')[2];
    const meId = state(code).members[0].id;

    has('막차·출발 권장 시간', '막차 카드 표시'); has('여유 있음', '여유 있는 경우 상태');
    // 지정 대상(주최자=나)에게 안부 확인 요청 배너
    has('안부를 확인해 주세요', '지정 대상에게 안부 확인 배너');
    const checkMember = state(code).members.find(x => x.status === 'check');
    clickAct('buddyOk'); await sleep(200);
    hasNot('안부를 확인해 주세요', '안부 확인 후 배너 사라짐');
    log(state(code).members.find(x => x.id === checkMember.id).status !== 'check', '안부 확인 후 상태 복귀');
    has('안부를 확인했어요', '확인 결과 알림');

    // 단계별 안부 확인: 1단계(본인 알림) → 2단계(지정 대상 요청)
    clickAct('simOverdue'); await sleep(200);
    has('예상 도착 시간이 지났어요. 괜찮으신가요?', '1단계: 본인에게 확인 알림');
    log(state(code).members[0].status !== 'check', '1단계에서는 위험 상태로 단정하지 않음');
    clickAct('simOverdue'); await sleep(200);
    has('잘 가고 계신가요?', '2단계: 응답 없으면 확인 필요 상태');
    has('응답하지 않았어요', '2단계: 지정 대상 요청 알림');
    log(state(code).members[0].status === 'check', '상태가 "귀가 확인 필요"로 변경');
    clickAct('respond'); await sleep(200);
    log(['started', 'together'].includes(state(code).members[0].status), '응답 후 귀가 중 상태로 복귀');

    // 자동 도착 감지(시뮬레이션)
    clickAct('simNear'); await sleep(200);
    has('목적지 근처에 도착한 것 같아요', '자동 도착 감지 배너');
    clickAct('nearNo'); await sleep(200);
    log(!D().querySelector('[data-act=nearYes]'), '"아직이에요" 후 배너 사라짐');
    clickAct('simNear'); await sleep(200); clickAct('nearYes'); await sleep(200);
    log(state(code).members[0].status === 'arrived', '감지 확인 후 도착 완료 처리');

    // 막차 위험: 귀가 시작 전, 출발 예정이 막차(00:20)보다 늦은 경우
    S().resetJourney(code);
    S().registerInfo(code, meId, { departTime: '00:40' });
    W().location.hash = '#/'; await sleep(100); W().location.hash = '#/m/' + code; await sleep(300);
    has('막차 놓칠 수 있음', '막차 위험 상태 표시');
    has('막차(00:20)보다 늦어요', '막차 위험 사전 알림 생성');
    has('막차 위험', '해산 매니저 막차 위험 행');
    clickAct('applyRec'); await sleep(200);
    log(state(code).members[0].departTime === '00:00', '출발 권장 시간으로 변경 → ' + state(code).members[0].departTime);
    has('여유 있음', '변경 후 막차 여유 상태');

    // 도보/택시는 막차 제한 없음
    S().registerInfo(code, meId, { mode: '택시' });
    W().location.hash = '#/'; await sleep(100); W().location.hash = '#/m/' + code; await sleep(300);
    has('막차 제한이 없어요', '택시는 막차 제한 없음');

  } catch (e) { log(false, 'EXCEPTION ' + e.message); }
  document.getElementById('out').textContent = 'DONE\n' + out.join('\n') + '\nFAILS=' + out.filter(x => x.startsWith('FAIL')).length;
})();
</script>
