<!doctype html>
<meta charset="utf-8">
<title>e2e</title>
<pre id="out">RUNNING</pre>
<iframe id="f" src="../index.html" style="width:420px;height:800px"></iframe>
<script>
const out = [];
const log = (ok, msg) => out.push((ok ? 'PASS ' : 'FAIL ') + msg);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
const D = () => f.contentDocument, W = () => f.contentWindow;
const text = () => D().body.innerText;
const click = sel => { const e = D().querySelector(sel); if (!e) throw new Error('no element ' + sel); e.click(); };
const clickText = (t, tag = 'button,a') => { const e = [...D().querySelectorAll(tag)].find(x => x.textContent.includes(t)); if (!e) throw new Error('no button ' + t); e.click(); };
const setv = (n, v) => { const e = D().querySelector(`[name="${n}"]`); e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); };
const submit = sel => D().querySelector(sel).dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
const has = (t, msg) => log(text().includes(t), msg + ` ("${t}")`);

(async () => {
  try {
    await sleep(500);
    W().localStorage.clear(); W().location.hash = '#/'; W().location.reload(); await sleep(600);
    has('함께 가고,', '메인 슬로건'); has('모임 만들기', '모임 만들기 버튼'); has('모임 참여하기', '모임 참여하기 버튼');
    log(D().querySelectorAll('.feature').length === 6, '핵심 기능 카드 6개');

    // 1. 모임 생성: 검증 오류 → 정상 생성
    click('a[href="#/create"]'); await sleep(200);
    submit('form[data-form=create]'); await sleep(100);
    has('이름을 입력해 주세요', '빈 폼 검증 오류');
    setv('host', '지은'); setv('name', '목요 스터디'); setv('place', '없는역'); submit('form[data-form=create]'); await sleep(100);
    has('목록에 있는 역', '잘못된 역 검증');
    setv('place', '강남역'); click('[data-act=step][data-d="1"]'); submit('form[data-form=create]'); await sleep(300);
    has('모임이 만들어졌어요', '모임 생성 완료 화면');
    const code = W().location.hash.split('/')[2];
    log(/^[A-Z0-9]{6}$/.test(code), '초대 코드 생성 ' + code);
    has('목요 스터디', '모임 이름 표시');

    // 2. 시연용 친구 불러오기 (정원 6 → 5명 추가)
    clickText('시연용 친구 불러오기', 'a'); await sleep(300);
    has('6/6명', '정원만큼 친구 추가');

    // 3. 내 귀가 정보 등록
    click('a[href$="/register"]'); await sleep(200);
    setv('dest', '없는역'); submit('form[data-form=register]'); await sleep(100);
    log(!!D().querySelector('[data-err=dest]').textContent, '목적지 역 이름 검증');
    setv('dest', '잠실역'); setv('time', '22:10');
    D().querySelector('input[name=privacy][value=status]').checked = true;
    submit('form[data-form=register]'); await sleep(400);

    // 4. 매칭 결과
    has('동행 매칭 결과', '매칭 결과 화면');
    log(/귀가 방향이 (유사합니다|어느 정도 비슷합니다)/.test(text()), '매칭 이유 표시');
    has('함께 이동 약', '함께 이동 구간 표시');
    has('매칭 점수', '매칭 점수 표시');
    const groups = D().querySelectorAll('.group-card').length;
    log(groups >= 1, '그룹 카드 ' + groups + '개 / 혼자 귀가 영역: ' + text().includes('혼자 귀가하게 되는'));
    const st = JSON.parse(W().localStorage.getItem('eodiya.v1')).meetings[code];
    log(st.members.length === 6 && st.members.every(m => m.registered), '참여자 6명 모두 등록');
    console.log(JSON.stringify(st.groups.map(g => ({ id: g.id, n: g.memberIds.length, score: g.score, shared: g.sharedMin, split: g.splitStation })), null, 0));
    console.log('solo=' + st.soloIds.map(i => st.members.find(m => m.id === i).name));
    console.log('dests=' + st.members.map(m => m.name + ':' + m.dest + '@' + m.departTime).join(' | '));

    // 5. 그룹 참여 → 대시보드
    const mineJoin = D().querySelector('[data-act=decide][data-join="1"]');
    if (mineJoin) { mineJoin.click(); await sleep(150); has('이 그룹에 참여 중', '그룹 참여 버튼 동작'); }
    else log(true, '내 그룹 없음(혼자 귀가) — 참여 버튼 생략');
    clickText('귀가 현황 보러 가기', 'a'); await sleep(300);
    has('전체 귀가 현황', '대시보드 표시');
    has('0/6', '도착 0/6');

    // 6. 목적지 비공개: 내 목적지는 나에게만 보이고, 다른 참여자 정보는 공개 범위에 맞게 표시
    has('나만 정확히 볼 수 있어요', '내 정확한 목적지는 본인에게만 표시');
    const raw = text();
    log(raw.includes('목적지 비공개'), '"귀가 상태만 공개" 참여자 목적지 숨김');
    log(raw.includes('방면'), '"대략적 지역" 참여자는 ○○구 방면으로 표시');

    // 7. 귀가 시작 → 동행 중/시작
    clickText('귀가 시작'); await sleep(200);
    log(/동행 중|귀가 시작/.test(text()), '귀가 시작 후 상태 변경');
    has('귀가를 시작했어요', '그룹 알림 생성');

    // 8. 안부 확인 요청(주최자) → 응답
    const req = D().querySelector('[data-act=reqCheck]');
    if (req) { /* 내가 아닌 귀가 중인 사람 없음 → 시연 친구 시작 후 */ }
    clickText('나 빼고 모두 도착 처리'); await sleep(300);
    has('5/6', '시연 친구 5명 도착 5/6');
    has('마지막 미도착', '마지막 미도착 인원 표시');
    log(!text().includes('모두 무사히 도착했어요'), '아직 전체 완료 아님');

    // 9. 플랜 B (귀가 중에)
    click('a[href$="/planb"]'); await sleep(200);
    D().querySelector('input[name=sit][value=lastTrain]').click(); await sleep(200);
    has('택시로 이동', '플랜 B 대체 방법 표시'); has('약', '예상 소요시간 표시');
    clickText('이 방법으로 변경하고 그룹에 알리기'); await sleep(200);
    has('적용 중인 계획', '플랜 B 적용');
    D().querySelector('input[name=sit][value=late]').click(); await sleep(200);
    has('새 출발 시간', '출발 지연 폼');

    // 10. 설정: 공개 범위 변경 / 공유 중단
    W().location.hash = `#/m/${code}/settings`; await sleep(200);
    const sc = D().querySelector('input[name=shareStopped]'); sc.checked = true; sc.dispatchEvent(new Event('change', { bubbles: true })); await sleep(100);
    let me = JSON.parse(W().localStorage.getItem('eodiya.v1')).meetings[code].members[0];
    log(me.shareStopped === true, '위치 공유 중단 저장');
    const pv = D().querySelector('input[name=privacy][value=exact]'); pv.checked = true; pv.dispatchEvent(new Event('change', { bubbles: true })); await sleep(100);
    me = JSON.parse(W().localStorage.getItem('eodiya.v1')).meetings[code].members[0];
    log(me.privacy === 'exact', '위치 공개 범위 변경 저장');

    // 11. 마지막 사람 도착 → 전체 완료
    W().location.hash = `#/m/${code}`; await sleep(300);
    clickText('도착 완료'); await sleep(300);
    has('모두 무사히 도착했어요', '전체 귀가 완료 화면');
    has('6/6', '도착 6/6');

    // 12. 새로고침 후 데이터 유지
    W().location.reload(); await sleep(600);
    has('모두 무사히 도착했어요', '새로고침 후 데이터 유지');

    // 13. 다른 사람으로 참여 (초대 코드)
    W().localStorage.setItem('eodiya.v1', W().localStorage.getItem('eodiya.v1'));
    W().location.hash = '#/join'; await sleep(200);
    setv('code', code.toLowerCase()); setv('name', '지우'); submit('form[data-form=join]'); await sleep(300);
    has('목요 스터디', '초대 코드로 기존 참여자 재접속');
    W().location.hash = '#/join'; await sleep(200);
    setv('code', code); setv('name', '낯선사람'); submit('form[data-form=join]'); await sleep(200);
    has('정원', '정원 초과 시 참여 거부');
    setv('code', 'ZZZZZZ'); setv('name', '낯선사람'); submit('form[data-form=join]'); await sleep(200);
    has('찾을 수 없어요', '잘못된 초대 코드 오류');
  } catch (e) { log(false, 'EXCEPTION ' + e.message); }
  document.getElementById('out').textContent = 'DONE\n' + out.join('\n') + '\nFAILS=' + out.filter(x => x.startsWith('FAIL')).length;
})();
</script>
